<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram: GXVless</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <meta http-equiv="refresh" content="3;url=https://t.me/+GCZdmquJCUw3OGZi">
    
    <style>
        :root {
            --bg-color: #1c1c1c;
            --card-bg: #242424;
            --text-main: #ffffff;
            --text-secondary: #aaaaaa;
            --tg-blue: #24A1DE;
            --tg-blue-hover: #2196d1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--text-main);
        }

        .tg-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 380px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .tg-logo-wrap {
            width: 100px;
            height: 100px;
            background: var(--tg-blue);
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(36, 161, 222, 0.3);
        }

        .tg-logo-wrap i {
            font-size: 50px;
            color: white;
            margin-right: 0px;
            margin-top: 0px;
        }

        h1 { 
            font-size: 24px; 
            margin-bottom: 12px; 
            font-weight: 600;
        }

        p { 
            color: var(--text-secondary); 
            font-size: 15px; 
            line-height: 1.5; 
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background-color: var(--tg-blue);
            color: white;
            padding: 14px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: var(--tg-blue-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(36, 161, 222, 0.4);
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        #timer {
            color: var(--tg-blue);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="tg-card">
    <div class="tg-logo-wrap">
        <i class="fa-brands fa-telegram"></i>
    </div>
    <h1>GXVless</h1>
    <p>Переходим в Telegram... <br>Если ничего не произошло, нажмите кнопку.</p>
    
    <a href="https://t.me/+GCZdmquJCUw3OGZi" class="btn">ОТКРЫТЬ КАНАЛ</a>
    
    <div class="footer">
        Осталось <span id="timer">3</span> сек.
    </div>
</div>

<script>
    let seconds = 3;
    const timerElement = document.getElementById('timer');
    const interval = setInterval(() => {
        seconds--;
        if (seconds >= 0) {
            timerElement.innerText = seconds;
        }
        if (seconds <= 0) {
            clearInterval(interval);
            window.location.href = "https://t.me/+GCZdmquJCUw3OGZi";
        }
    }, 1000);
</script>

</body>
</html>
